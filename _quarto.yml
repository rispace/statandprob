format:
  html:
    theme:
      light: [cosmo, theme-light.scss]
      dark: [cosmo, theme-dark.scss]
    css: styles.css
    toc: true
    toc-location: left
    grid:
      sidebar-width: 245px
      body-width: 900px
      margin-width: 220px
      gutter-width: 1.5rem
    code-copy: true
    code-overflow: scroll
    code-line-numbers: false
    highlight-style: github
    code-tools: true
    code-fold: false
    code-block-bg: false
    code-block-border-left: false
    anchor-sections: true
    smooth-scroll: true
    link-external-icon: false
    link-external-newwindow: true
    include-after-body: [link-behavior.html, share.html]

